function topo() {
  const paths = [];
  for (let k = 0; k < 10; k++) {
    const r = 24 + k * 22;
    let d = '';
    for (let s = 0; s <= 64; s++) {
      const a = (s / 64) * Math.PI * 2;
      const rr = r * (1 + 0.13 * Math.sin(3 * a + k * 0.5) + 0.07 * Math.cos(5 * a - k));
      d += `${s ? 'L' : 'M'}${(250 + rr * Math.cos(a)).toFixed(1)} ${(50 + rr * 0.75 * Math.sin(a)).toFixed(1)}`;
    }
    paths.push(`<path d="${d}Z"/>`);
  }
  return `<svg class="topo" viewBox="0 0 320 300" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#F4EFE4" stroke-width="1.1">${paths.join('')}</svg>`;
}
function aRow(i) {
  const left = i.qty
    ? `<div class="a-step"><button data-action="dec" data-id="${i.id}">${ic('minus')}</button><b>${i.qty}</b><button data-action="inc" data-id="${i.id}">${ic('plus')}</button></div>`
    : `<button class="a-add" data-action="inc" data-id="${i.id}">${ic('plus')}</button>`;
  return `<div class="a-row ${i.qty ? '' : 'out'}">${left}<div class="txt"><div class="nm">${i.name}</div><div class="br">${i.brand}</div></div><div class="wt">${fmtW(i.g)}${i.ml ? `<small>${fmtL(i.ml)}</small>` : ''}</div></div>`;
}
function aGroups(list, inPack) {
  return groups(list).map((g) => `
    <div class="a-cat"><span class="a-ci" style="background:${catColor('A', g.cat)}">${ic(g.cat.icon)}</span>${g.cat.label}
      <span class="sub">${inPack ? fmtW(sumG(g.items)) : `${g.items.length} items`}</span></div>
    <div class="a-card">${g.items.map(aRow).join('')}</div>`).join('');
}
function aBottle(fill) {
  const d = 'M30 4h20v14c0 6 18 12 18 30v110a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8V48c0-18 18-24 18-30z';

    <g clip-path="url(#abot)"><rect width="80" height="170" fill="#EFE8DA"/><rect y="${166 - h}" width="80" height="${h + 4}" fill="#5E7A8C"/>
    <rect y="${166 - h}" width="80" height="3" fill="#8FA9BA"/></g>
    <path d="${d}" fill="none" stroke="#2F4A3A" stroke-width="2.5"/><rect x="27" y="0" width="26" height="8" rx="2" fill="#D9682B"/></svg>`;
}

function cRing(s) {
  const r = 54;
  const C = 2 * Math.PI * r;
  const segs = [{ g: s.pack.g }, ...s.byCat];
  let off = 0;
  const arcs = segs.map((x, k) => {
    const len = (x.g / s.total) * C;
    const arc = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="#fff" stroke-opacity="${1 - k * 0.08}" stroke-width="12" stroke-dasharray="${Math.max(len - 2.5, 0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
    off += len;
    return arc;
  }).join('');
  return `<svg viewBox="0 0 132 132" width="132" style="flex:none"><circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="12"/>${arcs}

}

  key: 'C',
  name: 'Basecamp',
  blurb: 'Bright, friendly, modern consumer app. Lake blue and alpine-glow coral, soft shadows, big rounded cards. Approachable for casual campers, not just gram-counters.',
  changes: [
    '<code>MyPackHeader</code> and <code>MyPackStatsBar</code> become a gradient hero with a base-weight donut (a quick version of <code>CategoryPieChart</code>)',
    '<code>PackItem</code> becomes a large card; the selected pack turns into a gradient',
    '<code>CategorizedItemList</code> uses one rounded card per category with a colored icon tile',
    '<code>MyPackToolbar</code> becomes a row of labeled icon tiles',
    'Tab bar floats as a rounded bar (<code>tabBarStyle</code> with absolute positioning)',
    '<code>WaterBottle</code> becomes a droplet with a wave; <code>CategoriesScreen</code> becomes a two-column tile grid',
  ],
  tokens: [['primary', '#2B59C3'], ['secondary', '#5BB6A6'], ['tertiary', '#FF8A5B'], ['background', '#F3F6FB'], ['surface', '#FFFFFF'], ['onSurface', '#162033'], ['outline', '#E2E8F2'], ['primaryContainer', '#E3EBFB']],
  palette: ['#3FA7D6', '#F2B134', '#F07F4F', '#2B59C3', '#9B7BEA', '#E86A92', '#5BB6A6', '#7BC67E', '#FF6B6B', '#6C7A9C', '#C3A6FF', '#14B8A6'],
  type: 'Plus Jakarta Sans throughout (800 for titles and numbers)',
  shape: '<code>roundness: 6</code>, 20–28px cards, soft drop shadows',
  screens: {
    locker: () => cHead('Good evening, Zach', 'Locker') + `
      <div class="c-sec"><h2>Your packs</h2><button class="c-plus">${ic('plus')}New</button></div>
      <div class="c-packs">${PACKS.map((p) => {
        const sel = p.id === state.pack;
        return `<div class="c-pack ${sel ? 'sel' : ''}" data-action="pack" data-id="${p.id}">${sel ? `<span class="on">${ic('check')}Selected</span>` : ''}<div class="ic">${ic('bag-personal')}</div>
          <div class="brand">${p.brand}</div><div class="model">${p.model}</div><div class="meta"><span>${p.l} L</span><span>${fmtW(p.g)}</span></div></div>`;
      }).join('')}</div>
      <div class="c-sec"><h2>Inventory</h2><button class="c-plus">${ic('plus')}Item</button></div>
      ${cGroups(state.items, false)}`,
    mypack: () => {
      const s = S();
      return cHead('Ready for the trail?', 'My Pack') + `
      <div class="c-hero">${cMountains()}
        <div class="top"><div><div class="brand">${s.pack.brand}</div><div class="model">${s.pack.model}</div></div><span class="cap">${s.pack.l} L</span></div>
        <div class="main">${cRing(s)}<div class="side"><div class="st"><span>Total weight</span><b>${fmtW(s.total)}</b></div><div class="st"><span>With liquid</span><b>${fmtW(s.wet)}</b></div></div></div>
      </div>
      <div class="c-acts">${cAct('chart-pie', 'Chart', '#2B59C3')}${cAct('playlist-check', 'Checklist', '#5BB6A6')}${cAct('content-save-outline', 'Save', '#9B7BEA')}${cAct('import', 'Load', '#F2B134')}
        <button class="c-act" data-action="empty"><span class="tile" style="color:#E86A92">${ic('trash-can-outline')}</span>Empty</button></div>
      <div class="c-sec"><h2>In my pack</h2><span class="c-count">${s.inPack.length} items</span></div>
      ${s.inPack.length ? cGroups(s.inPack, true) : cEmpty()}`;
    },
    water: () => {
      const s = S();
      const f = state.fill / 100;
      const cont = s.inPack.filter((i) => i.ml);
      return cHead('Stay hydrated', 'Water') + `
      <div class="c-wcard">${cDrop(state.fill)}
        <div class="c-conts">${cont.map((i) => `<span>${i.qty}× ${i.name}</span>`).join('') || '<span>No containers</span>'}</div>
        <div class="c-sl-l"><span>Fill level</span><b>${state.fill}%</b></div>${slider('c')}
      </div>
      <div class="c-tiles">
        <div class="c-st" style="background:#E8F4FB;color:#1F6E95"><span>Liquid</span><b>${fmtL(s.liquidMl * f)}</b><small>of ${fmtL(s.liquidMl)}</small></div>
        <div class="c-st" style="background:#EEE9FD;color:#5B3FB8"><span>Liquid weight</span><b>${fmtW(s.liquidMl * f)}</b><small>of ${fmtW(s.liquidMl)}</small></div>
        <div class="c-st" style="background:#FFEDE5;color:#B4502A"><span>Pack total</span><b>${fmtW(s.total + s.liquidMl * f)}</b><small>max ${fmtW(s.wet)}</small></div>
      </div>`;
    },
    categories: () => cHead('Organize your gear', 'Categories') + `
      <div class="c-catgrid">${CATS.map((c) => {
        const col = catColor('C', c);
        const n = state.items.filter((i) => i.cat === c.id).length;
        return `<div class="c-cat"><span class="c-tile" style="background:${col}1f;color:${col}">${ic(c.icon)}</span>${c.stock ? '<span class="stk">STOCK</span>' : ''}
          <div class="nm">${c.label}</div><div class="sm">${n} items${c.exempt ? ' · not in base' : ''}</div></div>`;
      }).join('')}<div class="c-cat new">${ic('plus')} New category</div></div>`,
    settings: () => cHead('Make it yours', 'Settings') + `
      <div class="c-prof"><div class="av">ZM</div><div><div class="nm">Zach McCoy</div><small>zach@example.com</small></div><button>Sign out</button></div>
      <div class="c-set" style="margin-top:14px"><div class="lb">${ic('weight')}Weight units</div>${seg('c', 'unit', UNIT_OPTS, state.unit)}</div>
      <div class="c-set" style="margin-top:10px"><div class="lb">${ic('water')}Liquid units</div>${seg('c', 'liq', LIQ_OPTS, state.liq)}</div>
      <div class="c-foot">Trail Pack Pro · © 2026 Zach McCoy</div>`,
  },
  tabbar: (phone, active) => {
    const n = S().inPack.length;
    return `<nav class="c-tabs">${TABS.map((t) => `<button class="c-tab ${t.key === active ? 'on' : ''}" data-action="tab" data-phone="${phone}" data-tab="${t.key}">
      ${ic(t.icon)}<span>${t.label}</span>${t.key === 'mypack' && n ? `<span class="c-badge">${n}</span>` : ''}</button>`).join('')}</nav>`;
  },
};

const VARIANTS = { A, B, C };
const ORDER = ['A', 'B', 'C'];

/* ---------------------------------------------------------------- render */
const root = document.getElementById('root');
let lastVariant = null;

function panel(v) {
  return `<header class="panel">
    <div><div class="pk">Variant ${v.key} of ${ORDER.length}</div><h1>${v.name}</h1><p>${v.blurb}</p>
      <div class="pk" style="margin-top:4px">Components you own that change</div><ul>${v.changes.map((c) => `<li>${c}</li>`).join('')}</ul></div>
    <div><div class="pk">Theme tokens for <code>src/theme/theme.ts</code> (MD3 keys)</div>
      <div class="sw">${v.tokens.map(([k, c]) => `<div class="s"><span style="background:${c}"></span><b>${k}</b><code>${c}</code></div>`).join('')}</div>
      <div class="pk" style="margin-top:14px">Category and chart palette (<code>chartColors</code>)</div>
      <div class="pal">${v.palette.map((c) => `<span style="background:${c}"></span>`).join('')}</div>
      <div class="pmeta"><div><span>Type</span>${v.type}</div><div><span>Shape</span>${v.shape}</div></div></div>
  </header>
  <div class="hint">Everything is live and shared across the three phones. Tap any tab bar to change that phone's screen, use +/− on items, select packs, drag the fill slider, or change units in Settings.</div>`;
}

function phone(v, tab, i) {
  const label = TABS.find((t) => t.key === tab).label;
  return `<div><div class="phone-cap">${label}</div><div class="phone v${v.key}" data-phone="${i}">
    <div class="statusbar"><span>9:41</span><span class="icons">${ic('signal')}${ic('wifi')}${ic('battery')}</span></div>
    <div class="screen-body">${v.screens[tab]()}</div>${v.tabbar(i, tab)}</div></div>`;
}

function render() {
  const v = VARIANTS[state.variant];
  const scrolls = lastVariant === state.variant ? [...document.querySelectorAll('.screen-body')].map((el) => el.scrollTop) : [];
  root.innerHTML = panel(v) + `<div class="phones">${state.phoneTabs.map((t, i) => phone(v, t, i)).join('')}</div>`;
  document.querySelectorAll('.screen-body').forEach((el, i) => { el.scrollTop = scrolls[i] || 0; });
  document.getElementById('switcher-label').textContent = `${v.key} — ${v.name}`;
  document.title = `PROTOTYPE · ${v.key} ${v.name}`;
  lastVariant = state.variant;
}

function setVariant(key) {
  state.variant = key;
  try {
    const url = new URL(location.href);
    url.searchParams.set('variant', key);
    history.replaceState(null, '', url);
  } catch (e) { /* file:// in some browsers */ }
  render();
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', (e) => {
  const cyc = e.target.closest('[data-cycle]');
  if (cyc) {
    const idx = (ORDER.indexOf(state.variant) + Number(cyc.dataset.cycle) + ORDER.length) % ORDER.length;
    return setVariant(ORDER[idx]);
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, phone, tab, val } = el.dataset;
  const item = id && state.items.find((i) => String(i.id) === id);
  switch (action) {
    case 'tab': state.phoneTabs[Number(phone)] = tab; break;
    case 'inc': item.qty += 1; break;
    case 'dec': item.qty = Math.max(0, item.qty - 1); break;
    case 'pack': state.pack = id; break;
    case 'unit': state.unit = val; break;
    case 'liq': state.liq = val; break;
    case 'empty': state.items.forEach((i) => { i.qty = 0; }); break;
    case 'reset': state.items = clone(); break;
    default: return;
  }
  render();
});

let dragPhone = null;
function setFill(e) {
  const s = document.querySelector(`.phone[data-phone="${dragPhone}"] [data-slider]`);
  if (!s) return;
  const r = s.getBoundingClientRect();
  state.fill = Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * 100);
  render();
}
document.addEventListener('pointerdown', (e) => {
  const s = e.target.closest('[data-slider]');
  if (!s) return;
  dragPhone = s.closest('.phone').dataset.phone;
  e.preventDefault();
  setFill(e);
});
document.addEventListener('pointermove', (e) => { if (dragPhone !== null) setFill(e); });
document.addEventListener('pointerup', () => { dragPhone = null; });

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.closest && t.closest('input, textarea, [contenteditable]')) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const idx = (ORDER.indexOf(state.variant) + (e.key === 'ArrowRight' ? 1 : -1) + ORDER.length) % ORDER.length;
  setVariant(ORDER[idx]);
});

const initial = new URLSearchParams(location.search).get('variant');
state.variant = ORDER.includes(initial) ? initial : 'A';
render();
</script>
</body>
</html>
