name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest can select 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check types
        run: yarn tsc --noEmit
      - name: Run tests
        run: yarn test --watchAll=false --runInBand
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Install browser for PWA checks
        run: npx playwright install --with-deps chromium
      - name: Check development and production PWA shells
        run: yarn test:pwa:all
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
